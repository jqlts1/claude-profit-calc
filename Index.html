<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude 套餐利润计算器</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f4ef;
    --bg-tertiary: #faf9f5;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --accent: #6366f1;
    --accent-light: rgba(99,102,241,0.1);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1a1a1a;
      --bg-secondary: #242424;
      --bg-tertiary: #111111;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.15);
      --accent: #818cf8;
      --accent-light: rgba(129,140,248,0.12);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    margin: 0;
    padding: 32px 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.3px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 28px;
  }
  input[type="number"] {
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }
  input[type="number"]:hover { border-color: var(--border-strong); }
  input[type="number"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: linear-gradient(to right, var(--accent), var(--accent)) 0/var(--pct, 50%) 100% no-repeat, var(--border);
    border-radius: 3px;
    outline: none;
    transition: background 0.1s ease;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    background: var(--bg-primary);
    border: 2px solid var(--accent);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: var(--shadow-md);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: var(--shadow-lg);
  }
  input[type="range"]::-webkit-slider-thumb:active {
    transform: scale(1.05);
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px;
    background: var(--bg-primary);
    border: 2px solid var(--accent);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--accent);
  }
  .panel {
    background: var(--bg-secondary);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    transition: box-shadow 0.2s ease;
  }
  .panel:hover { box-shadow: var(--shadow-md); }
  .panel-title {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field-label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 6px; font-weight: 500; }
  .pkg-card {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.25s ease, transform 0.25s ease;
  }
  .pkg-card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-1px);
  }
  .pkg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .pkg-name { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
  .profit-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--accent-light);
    color: var(--accent);
  }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat {
    background: var(--bg-secondary);
    border-radius: 10px;
    padding: 10px 12px;
    transition: transform 0.15s ease;
  }
  .stat:hover { transform: scale(1.02); }
  .stat-label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
  .stat-value { font-size: 17px; font-weight: 600; margin-top: 3px; letter-spacing: -0.3px; }
  .stat-good { background: #ecfdf5; border: 1px solid #a7f3d0; }
  .stat-good .stat-value { color: #065f46; }
  .stat-warn { background: #fef2f2; border: 1px solid #fecaca; }
  .stat-warn .stat-value { color: #991b1b; }
  @media (prefers-color-scheme: dark) {
    .stat-good { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.2); }
    .stat-good .stat-value { color: #6ee7b7; }
    .stat-warn { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); }
    .stat-warn .stat-value { color: #fca5a5; }
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding: 10px 14px;
    background: var(--bg-secondary);
    border-radius: 10px;
  }
  .slider-row label { font-size: 12px; color: var(--text-secondary); min-width: 60px; font-weight: 500; }
  .slider-row input[type=range] { flex: 1; }
  .slider-row .val {
    font-size: 14px;
    font-weight: 600;
    min-width: 42px;
    text-align: center;
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .derived {
    font-size: 12px;
    color: var(--text-secondary);
    padding-top: 10px;
    margin-top: 4px;
    border-top: 1px solid var(--border);
    font-weight: 500;
  }
  .help-panel {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 12px;
  }
  @media (max-width: 520px) {
    .grid-3 { grid-template-columns: 1fr; }
    .grid-2 { grid-template-columns: 1fr; }
    body { padding: 20px 12px; }
    .pkg-card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Claude 套餐利润计算器</h1>
  <div class="subtitle">快速计算套餐定价、成本与利润，找到最优价格策略</div>

  <div class="panel">
    <div class="panel-title">进货成本设置</div>
    <div class="grid-3" style="margin-bottom: 10px;">
      <div>
        <label class="field-label">进货价 (元)</label>
        <input type="number" id="costPrice" value="400" step="10">
      </div>
      <div>
        <label class="field-label">对应每日额度 ($)</label>
        <input type="number" id="costQuota" value="60" step="5">
      </div>
      <div>
        <label class="field-label">基准倍率</label>
        <input type="number" id="baseRate" value="0.6" step="0.05">
      </div>
    </div>
    <div id="derivedCost" class="derived"></div>
  </div>

  <div class="panel">
    <div class="panel-title">对比参数</div>
    <div class="grid-2">
      <div>
        <label class="field-label">汇率 (元/美元)</label>
        <input type="number" id="exchangeRate" value="6.9" step="0.1">
      </div>
      <div>
        <label class="field-label">官方价 ($/刀)</label>
        <input type="number" id="officialPrice" value="1" step="0.01">
      </div>
    </div>
  </div>

  <div id="packages"></div>

  <div class="panel">
    <div class="panel-title">计算逻辑</div>
    <div class="help-panel">
      单位真实成本 = 进货价 × 基准倍率 ÷ (每日额度 × 30)<br>
      客户实际可烧 = 月额度 ÷ 客户倍率<br>
      套餐成本 = 客户实际可烧 × 单位真实成本<br>
      套餐利润 = 套餐价 − 套餐成本
    </div>
    <div style="text-align:center; padding-top:24px; font-size:12px; color:var(--text-secondary); opacity:0.6;">Made with Claude</div>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'claude_calc_state_v1';

  let packages = [
    { name: '基础版', price: 399, quota: 900, customerRate: 0.6 },
    { name: '标准版', price: 699, quota: 1800, customerRate: 0.6 },
    { name: '高级版', price: 999, quota: 3000, customerRate: 0.6 }
  ];

  let globals = {
    costPrice: 400, costQuota: 60, baseRate: 0.6,
    exchangeRate: 6.9, officialPrice: 1
  };

  // 从 localStorage 恢复
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) {
      if (saved.packages) packages = saved.packages;
      if (saved.globals) globals = saved.globals;
    }
  } catch(e) {}

  // 应用到输入框
  Object.keys(globals).forEach(k => {
    const el = document.getElementById(k);
    if (el) el.value = globals[k];
  });

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ packages, globals }));
    } catch(e) {}
  }

  const container = document.getElementById('packages');

  function getUnitCost() {
    return globals.costPrice * globals.baseRate / (globals.costQuota * 30);
  }

  function render() {
    const unitCost = getUnitCost();

    document.getElementById('derivedCost').textContent =
      '单位真实成本 = ' + unitCost.toFixed(4) + ' 元/真实烧$1';

    container.innerHTML = packages.map((p, i) => {
      const realApiUsable = p.quota / p.customerRate;
      const cost = realApiUsable * unitCost;
      const profit = p.price - cost;
      const profitRate = p.price > 0 ? (profit / p.price * 100) : 0;
      const pricePerDollar = p.price / p.quota;
      const officialRmb = globals.officialPrice * globals.exchangeRate;
      const discount = (pricePerDollar / officialRmb * 100);
      const saved = 100 - discount;

      const profitClass = profit < 50 ? 'stat-warn' : 'stat-good';

      const dailyQuota = p.quota / 30;

      return '<div class="pkg-card">' +
        '<div class="pkg-header">' +
          '<div>' +
            '<div class="pkg-name">' + p.name + '</div>' +
            '<div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">每日 $' + dailyQuota.toFixed(1) + ' · 共 $' + p.quota + '/月</div>' +
          '</div>' +
          '<div class="profit-badge">' + profitRate.toFixed(1) + '%</div>' +
        '</div>' +
        '<div class="grid-3" style="margin-bottom: 12px;">' +
          '<div><label class="field-label">套餐价 (元)</label><input type="number" data-i="' + i + '" data-k="price" value="' + p.price + '" step="10"></div>' +
          '<div><label class="field-label">月额度 ($)</label><input type="number" data-i="' + i + '" data-k="quota" value="' + p.quota + '" step="100"></div>' +
          '<div><label class="field-label">客户倍率</label><input type="number" data-i="' + i + '" data-k="customerRate" value="' + p.customerRate + '" step="0.05" min="' + globals.baseRate + '"></div>' +
        '</div>' +
        '<div class="slider-row">' +
          '<label>客户倍率</label>' +
          '<input type="range" data-i="' + i + '" data-k="customerRateSlider" min="' + globals.baseRate + '" max="2" step="0.05" value="' + p.customerRate + '" style="--pct:' + ((p.customerRate - globals.baseRate) / (2 - globals.baseRate) * 100) + '%">' +
          '<span class="val">' + p.customerRate.toFixed(2) + '</span>' +
        '</div>' +
        '<div class="stat-grid">' +
          '<div class="stat"><div class="stat-label">客户实际可烧API</div><div class="stat-value">$' + realApiUsable.toFixed(0) + '</div></div>' +
          '<div class="stat"><div class="stat-label">套餐成本 (元)</div><div class="stat-value">' + cost.toFixed(1) + '</div></div>' +
          '<div class="stat ' + profitClass + '"><div class="stat-label">套餐利润 (元)</div><div class="stat-value">' + profit.toFixed(1) + '</div></div>' +
          '<div class="stat"><div class="stat-label">一刀价 / 对比官方</div><div class="stat-value">' + pricePerDollar.toFixed(3) + ' <span style="font-size: 12px; color: var(--text-secondary); font-weight: 400;">省' + saved.toFixed(1) + '%</span></div></div>' +
        '</div>' +
      '</div>';
    }).join('');

    container.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', e => {
        const i = parseInt(e.target.dataset.i);
        let k = e.target.dataset.k;
        let v = parseFloat(e.target.value);
        if (isNaN(v)) return;
        if (k === 'customerRateSlider') k = 'customerRate';
        if (k === 'customerRate' && v < globals.baseRate) v = globals.baseRate;
        packages[i][k] = v;
        save();
        render();
      });
    });
  }

  ['costPrice', 'costQuota', 'baseRate', 'exchangeRate', 'officialPrice'].forEach(id => {
    document.getElementById(id).addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v)) {
        globals[id] = v;
        if (id === 'baseRate') {
          packages.forEach(p => {
            if (p.customerRate < v) p.customerRate = v;
          });
        }
        save();
        render();
      }
    });
  });

  render();
})();
</script>
</body>
</html>
